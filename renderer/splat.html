<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    canvas { image-rendering: pixelated; display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script src="splatcore.js"></script>
<script>
  const inst = SplatCore.attach(document.getElementById('c'), () => [window.innerWidth, window.innerHeight]);
  window.addEventListener('resize', () => inst.fit());
  window.addSplat = inst.addSplat;
</script>
</body>
</html>
