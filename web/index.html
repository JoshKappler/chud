<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chud</title>
  <style>
    html, body { margin: 0; height: 100dvh; overflow: hidden; background: #000;
      color: #f5efd7; font-family: 'Courier New', monospace; }
    body { display: flex; flex-direction: column; }

    #bar { display: flex; align-items: center; gap: 18px; padding: 6px 14px;
      background: #101408; border-bottom: 1px solid #2a331c; font-size: 13px; z-index: 5; }
    #bar .brand { font-weight: bold; letter-spacing: 1px; }
    #bar .menu { color: #7a8563; }
    #bar a { color: #57a63f; text-decoration: none; }
    #bar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: #7a8563; }
    #bar .batt { width: 20px; height: 9px; border: 1px solid #7a8563; border-radius: 2px; position: relative; }
    #bar .batt::before { content: ''; position: absolute; inset: 1px 30% 1px 1px; background: #57a63f; }
    #bar .batt::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 5px; background: #7a8563; }

    #field { position: relative; flex: 1; overflow: hidden; touch-action: none;
      background: radial-gradient(ellipse at 50% 35%, #17200e 0%, #0b1007 55%, #060904 100%); }

    .window { position: absolute; top: 26px; left: 22px; width: 240px;
      background: #10140a; border: 1px solid #333d22; box-shadow: 4px 4px 0 rgba(0,0,0,.5); }
    .window .titlebar { display: flex; align-items: center; gap: 6px; padding: 4px 8px;
      background: #1a2210; border-bottom: 1px solid #333d22; font-size: 11px; color: #93a077; }
    .window .titlebar i { width: 8px; height: 8px; border-radius: 50%; background: #57a63f; opacity: .7; }
    .window .winbody { padding: 10px 12px; font-size: 12px; line-height: 1.7; color: #c9c4ab; }

    .icons { position: absolute; top: 24px; right: 20px; display: flex;
      flex-direction: column; gap: 20px; }
    .icon { display: flex; flex-direction: column; align-items: center; gap: 5px;
      width: 74px; font-size: 11px; color: #a9b490; cursor: default; }
    .folder { width: 40px; height: 28px; background: #3f4d26; border: 1px solid #5b6f38;
      border-radius: 2px; position: relative; }
    .folder::before { content: ''; position: absolute; top: -6px; left: 0; width: 16px; height: 5px;
      background: #3f4d26; border: 1px solid #5b6f38; border-bottom: none; border-radius: 2px 2px 0 0; }
    .file { width: 30px; height: 36px; background: #202817; border: 1px solid #4a5731;
      border-radius: 2px; position: relative; }
    .file::before { content: ''; position: absolute; top: 7px; left: 5px; right: 5px; height: 2px;
      background: #4a5731; box-shadow: 0 6px 0 #4a5731, 0 12px 0 #4a5731; }

    #splat { image-rendering: pixelated; position: absolute; inset: 0;
      width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    #goblin { image-rendering: pixelated; position: absolute; left: 0; top: 0;
      width: min(336px, 72vmin); height: auto; cursor: grab; z-index: 3; touch-action: none; }
    #goblin:active { cursor: grabbing; }

    #subtitle { position: absolute; top: 14px; right: 110px; max-width: 300px; z-index: 4;
      background: #10140a; border: 1px solid #333d22; box-shadow: 4px 4px 0 rgba(0,0,0,.5);
      padding: 9px 12px; font-size: 12px; line-height: 1.6; color: #c9c4ab; }
    #subtitle:empty { display: none; }

    #dock { display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 8px 16px; background: #101408; border-top: 1px solid #2a331c; z-index: 5; }
    .dockicon { width: 38px; height: 38px; border: 1px solid #333d22; border-radius: 8px;
      background: #171d0e; position: relative; }
    .dockicon::before { content: ''; position: absolute; inset: 11px; border-radius: 3px; }
    .dockicon.a::before { background: #3f4d26; border-radius: 50%; }
    .dockicon.b::before { background: transparent; border-left: 8px solid #57a63f;
      border-top: 7px solid transparent; border-bottom: 7px solid transparent; inset: 12px 12px 12px 15px; }
    .dockicon.c::before { background: repeating-linear-gradient(0deg, #4a5731 0 3px, transparent 3px 6px); }
    button#talk { background: #171d0e; color: #f5efd7; border: 1px solid #333d22; border-radius: 8px;
      font: inherit; font-size: 13px; padding: 9px 18px; cursor: pointer; }
    button#talk:hover { border-color: #57a63f; }

    @media (max-width: 560px) {
      .window { width: 180px; }
      .icons { gap: 12px; }
      .icon { width: 60px; }
      #subtitle { right: 14px; top: auto; bottom: 14px; }
    }
  </style>
</head>
<body>
  <div id="bar">
    <span class="brand">ChudOS</span>
    <span class="menu">file</span>
    <span class="menu">edit</span>
    <span class="menu"><a href="https://github.com/JoshKappler/chud">github</a></span>
    <span class="right"><span class="batt"></span><span id="clock"></span></span>
  </div>
  <div id="field">
    <div class="window">
      <div class="titlebar"><i></i>readme.txt</div>
      <div class="winbody">a goblin is loose on this desktop.<br />click him. grab him. fling him.<br />he heals, eventually.</div>
    </div>
    <div class="icons">
      <div class="icon"><div class="folder"></div><span>screams</span></div>
      <div class="icon"><div class="folder"></div><span>teeth</span></div>
      <div class="icon"><div class="folder"></div><span>do not open</span></div>
      <div class="icon"><div class="file"></div><span>chud.exe</span></div>
    </div>
    <p id="subtitle"></p>
    <canvas id="splat"></canvas>
    <canvas id="goblin" width="336" height="336"></canvas>
  </div>
  <div id="dock">
    <div class="dockicon a"></div>
    <div class="dockicon b"></div>
    <button id="talk">talk to him</button>
    <div class="dockicon c"></div>
  </div>
  <script src="lib/pitchcore.js"></script>
  <script src="lib/crunchcore.js"></script>
  <script src="lib/skinphys.js"></script>
  <script src="renderer/goblin.js"></script>
  <script src="renderer/voicefx.js"></script>
  <script src="renderer/splatcore.js"></script>
  <script src="fling.js"></script>
  <script src="app.js"></script>
</body>
</html>
