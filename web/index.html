<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chud</title>
  <style>
    html, body { margin: 0; background: #000; color: #f5efd7; font-family: 'Courier New', monospace; }
    main { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 16px; text-align: center; }
    h1 { font-size: 22px; font-weight: normal; letter-spacing: 2px; margin: 0; }
    .hint { color: #888; font-size: 13px; margin: 0; }
    canvas { image-rendering: pixelated; width: min(88vw, 420px); height: auto; touch-action: manipulation; }
    #subtitle { min-height: 3em; max-width: 420px; font-size: 14px; color: #ccc; margin: 0; }
    button { background: #000; color: #f5efd7; border: 1px solid #444; font: inherit; font-size: 14px; padding: 8px 18px; cursor: pointer; }
    button:hover { border-color: #f5efd7; }
    .foot { font-size: 12px; margin-top: 18px; }
    .foot a { color: #57a63f; }
  </style>
</head>
<body>
  <main>
    <h1>chud</h1>
    <p class="hint">a goblin, stuck in this page. click him. he heals, eventually.</p>
    <canvas id="goblin" width="336" height="336"></canvas>
    <p id="subtitle"></p>
    <button id="talk">talk to him</button>
    <p class="foot"><a href="https://github.com/JoshKappler/chud">the real one lives on a desktop</a></p>
  </main>
  <script src="lib/pitchcore.js"></script>
  <script src="lib/crunchcore.js"></script>
  <script src="lib/skinphys.js"></script>
  <script src="renderer/goblin.js"></script>
  <script src="renderer/voicefx.js"></script>
  <script src="app.js"></script>
</body>
</html>
